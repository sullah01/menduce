<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Menduce</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-container {
            max-width: 450px;
            margin: 4rem auto;
            padding: 2.5rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .login-container h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
        }
        .login-container .subtitle {
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 2rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.8);
        }
        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }
        .form-group input:focus {
            outline: none;
            border-color: #00c9b7;
            box-shadow: 0 0 0 3px rgba(0, 201, 183, 0.1);
        }
        .btn-primary {
            width: 100%;
            padding: 1rem;
            background: #00c9b7;
            color: #0a0e17;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }
        .btn-primary:hover {
            background: #00b3a3;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 201, 183, 0.2);
        }
        .signup-link {
            text-align: center;
            margin-top: 1.5rem;
            color: rgba(255, 255, 255, 0.6);
        }
        .signup-link a {
            color: #00c9b7;
            text-decoration: none;
            font-weight: 500;
        }
        .signup-link a:hover {
            text-decoration: underline;
        }
        .error-message {
            color: #ff6b6b;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            display: none;
        }
        .success-message {
            color: #00c9b7;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            display: none;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 1.5rem;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
        }
        .back-link:hover {
            color: white;
        }
        @media (max-width: 768px) {
            .login-container {
                margin: 2rem 1rem;
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">Menduce<span>.</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="services.html">Solutions</a></li>
                <li><a href="industries.html">Industries</a></li>
                <li><a href="clients.html">Clients</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="signup.html" class="nav-cta">Sign Up</a></li>
            </ul>
            <button class="mobile-menu" aria-label="Toggle menu">☰</button>
        </div>
    </nav>

    <!-- Login Form -->
    <section class="login-container">
        <a href="index.html" class="back-link">← Back to Home</a>
        <h1>Welcome Back</h1>
        <p class="subtitle">Log in to access your Training Portal.</p>

        <form id="login-form">
            <div class="form-group">
                <label for="login-email">Email Address</label>
                <input type="email" id="login-email" required placeholder="you@example.com">
            </div>

            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" required placeholder="Enter your password">
            </div>

            <div id="error-message" class="error-message"></div>
            <div id="success-message" class="success-message"></div>

            <button type="submit" class="btn-primary">Log In</button>
        </form>

        <div class="signup-link">
            Don't have an account? <a href="signup.html">Sign up here</a>
        </div>
    </section>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Menduce. All rights reserved.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/login.js"></script>
    <script src="js/nav.js"></script>
</body>
</html>
